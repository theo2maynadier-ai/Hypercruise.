name: Hypercruise protected beta APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build dependencies
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install pinned JS transformer
        working-directory: security
        run: npm install --ignore-scripts --no-audit --no-fund --save-exact
      - name: Validate source and environment
        env:
          HYPER_SDK: ${{ env.ANDROID_HOME }}
        run: |
          bash security/check-build-env.sh
          bash security/beta-check.sh
      - name: Verify routing API and mixed-routing tests
        run: |
          node - <<'NODE'
          global.HC = require('./app/assets/core.js');
          global.HCTolls = require('./app/assets/toll-cost.js');
          for (const key of ['costBreakdown','savings','rules','allowed']) {
            if (typeof HC[key] !== 'function') throw Error('Missing HC API: ' + key);
          }
          NODE
          node tests/mixed-routing-0825.cjs
      - name: Restore persistent signing key
        env:
          HYPER_KEYSTORE_B64: ${{ secrets.HYPER_KEYSTORE_B64 }}
          HYPER_KEYSTORE_PASSWORD: ${{ secrets.HYPER_KEYSTORE_PASSWORD }}
        run: |
          test -n "$HYPER_KEYSTORE_B64" && test -n "$HYPER_KEYSTORE_PASSWORD" || { echo 'Missing signing secrets'; exit 1; }
          mkdir -p signing
          printf '%s' "$HYPER_KEYSTORE_B64" | base64 -d > signing/hypercruise.p12
          printf '%s\\n' "$HYPER_KEYSTORE_PASSWORD" > signing/password.txt
          chmod 600 signing/hypercruise.p12 signing/password.txt
      - name: Build hardened APK and enforce release gate
        env:
          HYPER_SDK: ${{ env.ANDROID_HOME }}
          HYPER_HARDENED: '1'
          HYPER_REQUIRE_SIGNING_KEY: '1'
        run: bash build.sh
      - name: Publish APK only (never upload signing files or sources)
        uses: actions/upload-artifact@v4
        with:
          name: Hypercruise-0.8.25-protected-beta
          path: output/Hypercruise-0.8.25.apk
          if-no-files-found: error
          retention-days: 7
