name: Hypercruise protected beta APK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hypercruise-protected-beta
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: security/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android build dependencies
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install pinned JS transformer
        working-directory: security
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Validate source and environment
        env:
          HYPER_SDK: ${{ env.ANDROID_HOME }}
        run: |
          bash security/check-build-env.sh
          bash security/beta-check.sh
      - name: Verify routing API exports and unit tests
        run: |
          node - <<'NODE'
          global.HC = require('./app/assets/core.js');
          global.HCTolls = require('./app/assets/toll-cost.js');
          for (const key of ['costBreakdown','savings','rules','allowed']) {
            if (typeof HC[key] !== 'function') throw Error('Missing HC API: ' + key);
          }
          console.log('Core routing exports OK');
          NODE
          node tests/mixed-routing-0825.cjs
      - name: Restore persistent signing key from GitHub Secrets
        env:
          HYPER_KEYSTORE_B64: ${{ secrets.HYPER_KEYSTORE_B64 }}
          HYPER_KEYSTORE_PASSWORD: ${{ secrets.HYPER_KEYSTORE_PASSWORD }}
        run: |
          test -n "$HYPER_KEYSTORE_B64" && test -n "$HYPER_KEYSTORE_PASSWORD" || { echo 'Missing signing secrets'; exit 1; }
          mkdir -p signing
          printf '%s' "$HYPER_KEYSTORE_B64" | base64 --decode > signing/hypercruise.p12
          printf '%s\n' "$HYPER_KEYSTORE_PASSWORD" > signing/password.txt
          chmod 600 signing/hypercruise.p12 signing/password.txt
      - name: Build hardened APK and enforce release gate
        env:
          HYPER_SDK: ${{ env.ANDROID_HOME }}
          HYPER_HARDENED: '1'
          HYPER_REQUIRE_SIGNING_KEY: '1'
        run: bash build.sh
      - name: Publish APK only (never upload signing files or sources)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Hypercruise-0.8.25-protected-beta
          path: output/Hypercruise-0.8.25.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material from runner
        if: always()
        run: rm -f signing/hypercruise.p12 signing/password.txt
