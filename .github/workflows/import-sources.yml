name: Import verified Hypercruise sources
on:
  push:
    branches: [main]
    paths:
      - import-payload/**
      - .github/workflows/import-sources.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify and import source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/hypercruise-source.tar.gz"
          staging="$RUNNER_TEMP/hypercruise-source"
          cat import-payload/part-* > "$archive"
          printf '%s  %s\n' 'ee031362e5215e95b044119496e971fd0cfb63e108e854e90380f987afbf5648' "$archive" | sha256sum --check --strict
          mkdir -p "$staging"
          tar -xzf "$archive" -C "$staging"
          test "$(find "$staging" -type f | wc -l)" -ge 370
          cp -a "$staging"/. .
          rm -rf import-payload .github/workflows/import-sources.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import complete Hypercruise 0.8.25 sources'
          git push origin HEAD:main
