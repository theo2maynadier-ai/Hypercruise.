name: Normalize imported file modes
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-modes.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Normalize tracked file modes
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | xargs -0 chmod 0644
          git grep -Il '^#!' | xargs -r chmod 0755
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: normalize imported file permissions'
          git push origin HEAD:main
